name: SBOM

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          cache: npm

      - name: Select the declared npm version
        run: npm install --global npm@11.5.1 --ignore-scripts

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Scan provenance
        env:
          PROVENANCE_DENY_TERMS: ${{ secrets.PROVENANCE_DENY_TERMS }}
          PROVENANCE_REQUIRE_DENY_TERMS: >-
            ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
            github.event_name == 'workflow_dispatch') && '1' || '0' }}
        run: node scripts/provenance-scan.mjs

      - name: Generate locked npm and Swift dependency manifests
        run: npm run sbom

      - name: Generate repository SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom/project.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.51.1

      - name: Validate machine-readable inventories
        run: >-
          node -e 'for (const file of
          ["sbom/npm.cdx.json","sbom/swift-dependencies.json","sbom/project.spdx.json"])
          JSON.parse(require("node:fs").readFileSync(file,"utf8"))'

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom/npm.cdx.json
            sbom/swift-dependencies.json
            sbom/project.spdx.json
          if-no-files-found: error
          retention-days: 14
